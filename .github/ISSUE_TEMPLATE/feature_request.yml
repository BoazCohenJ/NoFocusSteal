name: Feature request
description: Suggest something NoFocusSteal could do, or do better
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the situation first. The problem matters more than the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
  - type: textarea
    id: alternatives
    attributes:
      label: How do you handle it today?
      description: Another app, a workaround, or not at all.
